<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Corvinus Annotator</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <!-- A <label> pointed at a hidden input opens the file picker with no
             JavaScript click handler at all. -->
        <label id="open-button" for="file-input" title="Open image">+</label>
        <input id="file-input" type="file" accept="image/*" hidden />
        <span id="image-name">No image loaded</span>
      </header>

      <!-- Three canvases stacked in one positioned container. Same CSS box,
           same coordinate space, independently repaintable. -->
      <div id="canvas-area">
        <canvas id="layer-image"></canvas>
        <canvas id="layer-annotations"></canvas>
        <canvas id="layer-overlay"></canvas>
      </div>

      <footer id="statusbar">
        <span id="status-zoom">Zoom: -</span>
        <span id="status-cursor">X: -   Y: -</span>
        <span id="status-frame">0.00 ms/frame</span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
