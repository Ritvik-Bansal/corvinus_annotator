<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Corvinus Annotator - Agreement</title>
  </head>
  <body>
    <div id="app" class="compare">
      <header id="topbar">
        <a class="page-link" href="./index.html">&larr; Annotator</a>
        <label class="file-button" for="cmp-image">Image</label>
        <input id="cmp-image" type="file" accept="image/*" hidden />
        <label class="file-button" for="cmp-a">Annotator A</label>
        <input id="cmp-a" type="file" accept="application/json,.json" hidden />
        <label class="file-button" for="cmp-b">Annotator B</label>
        <input id="cmp-b" type="file" accept="application/json,.json" hidden />
        <span id="cmp-loaded"></span>
        <span id="cmp-message"></span>
      </header>

      <div id="canvas-area">
        <canvas id="layer-image"></canvas>
        <canvas id="layer-annotations"></canvas>
        <canvas id="layer-overlay"></canvas>
        <p id="canvas-empty"><span>Load an image, then two exported JSON files.</span></p>
      </div>

      <aside id="sidebar">
        <section class="panel">
          <h2>Threshold</h2>
          <div class="threshold">
            <input id="cmp-threshold" type="range" min="0.05" max="0.95" step="0.05" value="0.5" />
            <output id="cmp-threshold-value">0.50</output>
          </div>
          <div id="cmp-legend" class="legend"></div>
        </section>
        <section class="panel">
          <h2>Summary</h2>
          <div id="cmp-summary"></div>
        </section>
        <section class="panel" id="cmp-pairs-panel">
          <h2>Pairs, worst agreement first</h2>
          <div id="cmp-pairs"></div>
        </section>
      </aside>

      <footer id="statusbar">
        <span id="cmp-status">No files loaded</span>
      </footer>
    </div>
    <script type="module" src="/src/compare/main.ts"></script>
  </body>
</html>
